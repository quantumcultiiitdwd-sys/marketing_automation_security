name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: cs_test, POSTGRES_USER: cs, POSTGRES_PASSWORD: cs }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cs" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Migrations apply cleanly and match models
        env: { DATABASE_URL: "postgresql+psycopg://cs:cs@localhost:5432/cs_test" }
        run: alembic upgrade head && alembic check
      - name: Tests (Postgres)
        env: { TEST_DATABASE_URL: "postgresql+psycopg://cs:cs@localhost:5432/cs_test" }
        run: pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Tests (SQLite)
        run: pytest -q
      - name: OpenAPI schema is valid
        run: python -c "from app.main import app; import json; s=app.openapi(); assert '/v1/actions/execute' in s['paths']; print(len(s['paths']), 'paths')"
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build   # includes type checking
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t campaignshield-api:ci backend && docker build -t campaignshield-web:ci frontend
      - name: Scan images
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "campaignshield-api:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - name: End-to-end smoke (compose)
        run: |
          docker compose up -d --wait
          ./scripts/smoke.sh
          python3 scripts/e2e.py
          docker compose logs --tail=50 api
          docker compose down -v
